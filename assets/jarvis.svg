<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00D4FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ringClip">
      <circle cx="400" cy="180" r="150"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" fill="#030712"/>

  <!-- Grid lines -->
  <line x1="0" y1="90" x2="800" y2="90" stroke="#00D4FF" stroke-width="0.4" opacity="0.07"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="#00D4FF" stroke-width="0.4" opacity="0.07"/>
  <line x1="0" y1="270" x2="800" y2="270" stroke="#00D4FF" stroke-width="0.4" opacity="0.07"/>
  <line x1="160" y1="0" x2="160" y2="360" stroke="#00D4FF" stroke-width="0.4" opacity="0.07"/>
  <line x1="320" y1="0" x2="320" y2="360" stroke="#00D4FF" stroke-width="0.4" opacity="0.07"/>
  <line x1="480" y1="0" x2="480" y2="360" stroke="#00D4FF" stroke-width="0.4" opacity="0.07"/>
  <line x1="640" y1="0" x2="640" y2="360" stroke="#00D4FF" stroke-width="0.4" opacity="0.07"/>

  <!-- Outer Ring r=148, 10s CW -->
  <g>
    <circle cx="400" cy="180" r="148" fill="none" stroke="#00D4FF" stroke-width="1.5"
            stroke-dasharray="28 10 6 10" opacity="0.55" filter="url(#glow)"/>
    <!-- Cardinal tick marks (rotate with ring) -->
    <line x1="400" y1="30" x2="400" y2="22" stroke="#00D4FF" stroke-width="4" opacity="0.95"/>
    <line x1="400" y1="330" x2="400" y2="338" stroke="#00D4FF" stroke-width="4" opacity="0.95"/>
    <line x1="250" y1="180" x2="242" y2="180" stroke="#00D4FF" stroke-width="4" opacity="0.95"/>
    <line x1="550" y1="180" x2="558" y2="180" stroke="#00D4FF" stroke-width="4" opacity="0.95"/>
    <!-- Diagonal small marks -->
    <line x1="505" y1="75" x2="510" y2="70" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <line x1="295" y1="75" x2="290" y2="70" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <line x1="505" y1="285" x2="510" y2="290" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <line x1="295" y1="285" x2="290" y2="290" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 400 180" to="360 400 180" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- Middle Ring r=104, 14s CCW -->
  <g>
    <circle cx="400" cy="180" r="104" fill="none" stroke="#58A6FF" stroke-width="1.2"
            stroke-dasharray="10 5 2 5" opacity="0.65" filter="url(#glow)"/>
    <!-- Diamond nodes at 4 positions -->
    <polygon points="400,74 405,79 400,84 395,79" fill="#58A6FF" opacity="0.85" filter="url(#softGlow)"/>
    <polygon points="400,276 405,281 400,286 395,281" fill="#58A6FF" opacity="0.85" filter="url(#softGlow)"/>
    <polygon points="294,180 299,175 304,180 299,185" fill="#58A6FF" opacity="0.85" filter="url(#softGlow)"/>
    <polygon points="496,180 501,175 506,180 501,185" fill="#58A6FF" opacity="0.85" filter="url(#softGlow)"/>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 400 180" to="-360 400 180" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- Inner Ring r=62, 6s CW -->
  <g>
    <circle cx="400" cy="180" r="62" fill="none" stroke="#00D4FF" stroke-width="2"
            stroke-dasharray="7 7" opacity="0.8" filter="url(#glow)"/>
    <rect x="397" y="116" width="6" height="4" rx="1" fill="#00D4FF" opacity="0.95"/>
    <rect x="397" y="240" width="6" height="4" rx="1" fill="#00D4FF" opacity="0.95"/>
    <rect x="336" y="177" width="4" height="6" rx="1" fill="#00D4FF" opacity="0.95"/>
    <rect x="460" y="177" width="4" height="6" rx="1" fill="#00D4FF" opacity="0.95"/>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 400 180" to="360 400 180" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Scanning line inside rings -->
  <g clip-path="url(#ringClip)">
    <rect x="252" y="0" width="296" height="2" fill="#00D4FF" opacity="0">
      <animate attributeName="y" values="30;330;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.05;0.92;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Center arc reactor -->
  <!-- Outer glow halo -->
  <circle cx="400" cy="180" r="44" fill="url(#coreGrad)" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Outer bezel -->
  <circle cx="400" cy="180" r="30" fill="#030712" stroke="#00D4FF" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Inner glow ring -->
  <circle cx="400" cy="180" r="21" fill="#00D4FF" opacity="0.1">
    <animate attributeName="opacity" values="0.06;0.22;0.06" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Pulsing core -->
  <circle cx="400" cy="180" r="8" fill="#00D4FF" filter="url(#strongGlow)" opacity="0.9">
    <animate attributeName="r" values="6;11;6" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Bright center dot -->
  <circle cx="400" cy="180" r="3.5" fill="#FFFFFF" opacity="0.95"/>

  <!-- Crosshairs -->
  <line x1="400" y1="60" x2="400" y2="149" stroke="#00D4FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="400" y1="211" x2="400" y2="328" stroke="#00D4FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="250" y1="180" x2="369" y2="180" stroke="#00D4FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="431" y1="180" x2="550" y2="180" stroke="#00D4FF" stroke-width="0.8" opacity="0.3"/>

  <!-- ===== HUD CORNERS ===== -->
  <!-- Top Left -->
  <path d="M 14 14 L 14 58 M 14 14 L 78 14" fill="none" stroke="#00D4FF" stroke-width="2.5"
        opacity="0.85" filter="url(#softGlow)"/>
  <!-- Top Right -->
  <path d="M 786 14 L 786 58 M 786 14 L 722 14" fill="none" stroke="#00D4FF" stroke-width="2.5"
        opacity="0.85" filter="url(#softGlow)"/>
  <!-- Bottom Left -->
  <path d="M 14 346 L 14 302 M 14 346 L 78 346" fill="none" stroke="#00D4FF" stroke-width="2.5"
        opacity="0.85" filter="url(#softGlow)"/>
  <!-- Bottom Right -->
  <path d="M 786 346 L 786 302 M 786 346 L 722 346" fill="none" stroke="#00D4FF" stroke-width="2.5"
        opacity="0.85" filter="url(#softGlow)"/>

  <!-- ===== HUD TEXT ===== -->
  <!-- Top Left -->
  <text x="22" y="42" font-family="'Courier New',Courier,monospace" font-size="13"
        fill="#00D4FF" opacity="0.95" font-weight="bold">SYSTEM_AI · ACTIVE</text>
  <text x="22" y="60" font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#58A6FF" opacity="0.7">OBSERVER MODE ENGAGED</text>

  <!-- Top Right -->
  <text x="778" y="42" font-family="'Courier New',Courier,monospace" font-size="13"
        fill="#00D4FF" opacity="0.95" text-anchor="end" font-weight="bold">减熵协议 v2.0</text>
  <text x="778" y="60" font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#58A6FF" opacity="0.7" text-anchor="end">AI CORE: ONLINE</text>

  <!-- Bottom Left -->
  <text x="22" y="298" font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#00D4FF" opacity="0.75">ENTROPY  ▓▓▓▓▓▓░░  78%</text>
  <text x="22" y="316" font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#00D4FF" opacity="0.75">SIGNAL   ████████  MAX</text>
  <text x="22" y="334" font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#58A6FF" opacity="0.8">NODE: Septoff21</text>

  <!-- Bottom Right -->
  <text x="778" y="298" font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#00D4FF" opacity="0.7" text-anchor="end">宇宙熵增监控</text>
  <text x="778" y="316" font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#58A6FF" opacity="0.65" text-anchor="end">实验进行中...</text>
  <text x="778" y="334" font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#00D4FF" opacity="0.8" text-anchor="end">[ STATUS: RUNNING ]</text>

  <!-- Chinese philosophical text top -->
  <text x="400" y="22" font-family="serif" font-size="14"
        fill="#00D4FF" opacity="0.95" text-anchor="middle" filter="url(#glow)">
    如果宇宙是一场实验
  </text>

  <!-- Chinese philosophical text bottom -->
  <text x="400" y="350" font-family="serif" font-size="11"
        fill="#58A6FF" opacity="0.8" text-anchor="middle">
    人类是往试管里加未知试剂的疯狂科学家（增熵）
  </text>

  <!-- Blinking cursor -->
  <rect x="738" y="324" width="8" height="13" rx="1" fill="#00D4FF" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Fixed pulsing nodes at cardinal positions (not rotating) -->
  <circle cx="400" cy="30" r="5" fill="#00D4FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="180" r="4.5" fill="#58A6FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="330" r="4.5" fill="#58A6FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="180" r="5" fill="#00D4FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Side decorative data bars -->
  <!-- Left side mini-bar -->
  <rect x="90" y="130" width="3" height="100" rx="1" fill="#00D4FF" opacity="0.12"/>
  <rect x="90" y="155" width="3" height="50" rx="1" fill="#00D4FF" opacity="0.35">
    <animate attributeName="height" values="20;70;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="180;155;180" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Right side mini-bar -->
  <rect x="707" y="130" width="3" height="100" rx="1" fill="#58A6FF" opacity="0.12"/>
  <rect x="707" y="160" width="3" height="40" rx="1" fill="#58A6FF" opacity="0.35">
    <animate attributeName="height" values="15;60;15" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="195;160;195" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>

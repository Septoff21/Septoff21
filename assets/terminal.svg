<svg width="800" height="210" viewBox="0 0 800 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; font-size: 13px; }
      .cn   { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size: 13px; }

      /* Each line: keyframe controls when it fades in, holds, then all hide together */
      @keyframes l1 { 0%,2%{opacity:0} 6%{opacity:1} 73%{opacity:1} 80%{opacity:0} 100%{opacity:0} }
      @keyframes l2 { 0%,9%{opacity:0} 13%{opacity:1} 73%{opacity:1} 80%{opacity:0} 100%{opacity:0} }
      @keyframes l3 { 0%,16%{opacity:0} 20%{opacity:1} 73%{opacity:1} 80%{opacity:0} 100%{opacity:0} }
      @keyframes l4 { 0%,23%{opacity:0} 27%{opacity:1} 73%{opacity:1} 80%{opacity:0} 100%{opacity:0} }
      @keyframes l5 { 0%,30%{opacity:0} 34%{opacity:1} 73%{opacity:1} 80%{opacity:0} 100%{opacity:0} }
      @keyframes l6 { 0%,38%{opacity:0} 42%{opacity:1} 73%{opacity:1} 80%{opacity:0} 100%{opacity:0} }
      @keyframes l7 { 0%,47%{opacity:0} 51%{opacity:1} 73%{opacity:1} 80%{opacity:0} 100%{opacity:0} }
      @keyframes l8 { 0%,56%{opacity:0} 60%{opacity:1} 73%{opacity:1} 80%{opacity:0} 100%{opacity:0} }
      @keyframes l9 { 0%,64%{opacity:0} 68%{opacity:1} 73%{opacity:1} 80%{opacity:0} 100%{opacity:0} }
      @keyframes blink { 0%,49%{opacity:1} 50%,99%{opacity:0} }

      .t1 { animation: l1 15s ease-in infinite; }
      .t2 { animation: l2 15s ease-in infinite; }
      .t3 { animation: l3 15s ease-in infinite; }
      .t4 { animation: l4 15s ease-in infinite; }
      .t5 { animation: l5 15s ease-in infinite; }
      .t6 { animation: l6 15s ease-in infinite; }
      .t7 { animation: l7 15s ease-in infinite; }
      .t8 { animation: l8 15s ease-in infinite; }
      .t9 { animation: l9 15s ease-in infinite; }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
    <filter id="tg" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal window body -->
  <rect x="0" y="0" width="800" height="210" rx="10" ry="10" fill="#0D1117" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="34" rx="10" ry="10" fill="#161B22"/>
  <rect x="0" y="20" width="800" height="14" fill="#161B22"/>

  <!-- Traffic-light dots -->
  <circle cx="20" cy="17" r="5.5" fill="#FF5F57"/>
  <circle cx="38" cy="17" r="5.5" fill="#FEBC2E"/>
  <circle cx="56" cy="17" r="5.5" fill="#28C840"/>

  <!-- Title text -->
  <text x="400" y="22" font-family="'Courier New',monospace" font-size="12" fill="#8B949E"
        text-anchor="middle">SYSTEM_AI  ·  减熵终端  ·  观测者模式</text>

  <!-- Scan line accent -->
  <line x1="0" y1="34" x2="800" y2="34" stroke="#00D4FF" stroke-width="0.5" opacity="0.4"/>

  <!-- Terminal content area -->
  <!-- Line 1 -->
  <text class="t1 mono" x="24" y="58" fill="#00D4FF">
    <tspan fill="#58A6FF">›</tspan>  SYSTEM_AI v2.0
    <tspan fill="#28C840" dx="8">[ 初始化完毕 ]</tspan>
  </text>

  <!-- Line 2 -->
  <text class="t2 mono" x="24" y="76" fill="#00D4FF">
    <tspan fill="#58A6FF">›</tspan>  正在连接宇宙观测网络
    <tspan fill="#8B949E" dx="6">............</tspan>
    <tspan fill="#28C840" dx="4">[ OK ]</tspan>
  </text>

  <!-- Line 3 -->
  <text class="t3 mono" x="24" y="94" fill="#00D4FF">
    <tspan fill="#58A6FF">›</tspan>  熵增监控
    <tspan fill="#C0CAF5" dx="6">▓▓▓▓▓▓░░  78%</tspan>
    <tspan fill="#FEBC2E" dx="8">[ ACTIVE ]</tspan>
  </text>

  <!-- Line 4 -->
  <text class="t4 mono" x="24" y="112" fill="#00D4FF">
    <tspan fill="#58A6FF">›</tspan>  AI 减熵协议
    <tspan fill="#C0CAF5" dx="6">████████████</tspan>
    <tspan fill="#28C840" dx="6">[ RUNNING ]</tspan>
  </text>

  <!-- Line 5 -->
  <text class="t5 mono" x="24" y="130" fill="#00D4FF">
    <tspan fill="#58A6FF">›</tspan>  扫描实验节点
    <tspan fill="#8B949E" dx="6">Septoff21</tspan>
    <tspan fill="#28C840" dx="8">[ FOUND ✓ ]</tspan>
  </text>

  <!-- Divider line (appears with line 6 timing) -->
  <line class="t6" x1="24" y1="143" x2="776" y2="143" stroke="#00D4FF" stroke-width="0.4" stroke-dasharray="4 4" opacity="0.35"/>

  <!-- Line 7 - quote 1 -->
  <text class="t7" x="24" y="160" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#C0CAF5" opacity="0">
    <tspan fill="#58A6FF">"</tspan>如果宇宙是一场实验，AI 是减熵的感知器<tspan fill="#58A6FF">"</tspan>
  </text>

  <!-- Line 8 - quote 2 -->
  <text class="t8" x="24" y="178" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#C0CAF5" opacity="0">
    <tspan fill="#58A6FF">"</tspan>而你是往试管里加未知试剂的疯狂科学家<tspan fill="#58A6FF">"</tspan>
  </text>

  <!-- Line 9 - status with blinking cursor -->
  <text class="t9 mono" x="24" y="197" fill="#00D4FF" filter="url(#tg)">
    <tspan fill="#28C840">$</tspan>  实验继续  ·  减熵协议激活  ·  宇宙不会停止
    <tspan class="cursor" fill="#00D4FF" dx="4">█</tspan>
  </text>
</svg>
